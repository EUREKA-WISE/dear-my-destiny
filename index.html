<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Gửi Người Thương</title>
    <style>
        /* === CÀI ĐẶT CHUNG === */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fce4ec;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 1s ease-in-out;
        }

        #video-screen, #letter-screen, #envelope-transition-screen {
            opacity: 0; pointer-events: none; z-index: 1;
        }

        /* === HIỆU ỨNG NHIỀU MÈO CHÂN THỰC CỰC ĐẸP === */
        #cat-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
            transition: opacity 2s ease-in-out;
        }
        
        /* Chỉnh chung cho các ảnh GIF mèo */
        .cat-gif {
            position: absolute;
            width: 130px; /* Độ to nhỏ của mèo */
            height: auto;
            /* Tạo bóng đổ để mèo trông chân thực, có chiều sâu so với nền */
            filter: drop-shadow(3px 8px 10px rgba(0,0,0,0.25));
        }

        /* 1. Mèo đi bộ dạo ngang màn hình */
        .cat-walking {
            bottom: 150px;
            left: -150px;
            animation: catWalk 14s linear infinite;
        }
        @keyframes catWalk {
            0% { transform: translateX(0) scaleX(1); }
            45% { transform: translateX(110vw) scaleX(1); } /* Đi hết mép phải */
            50% { transform: translateX(110vw) scaleX(-1); } /* Quay đầu lại */
            95% { transform: translateX(-150px) scaleX(-1); } /* Đi về mép trái */
            100% { transform: translateX(-150px) scaleX(1); } /* Trở lại ban đầu */
        }

        /* 2. Mèo lơ lửng ngắm nhìn bên góc trái */
        .cat-floating {
            top: 15%; left: 10%;
            width: 150px;
            animation: catFloat 4s ease-in-out infinite alternate;
        }
        @keyframes catFloat {
            0% { transform: translateY(0px) rotate(-3deg); }
            100% { transform: translateY(-20px) rotate(3deg); }
        }
        /* 3. Mèo lơ lửng ngắm nhìn bên góc phải */
        .cat-floating1 {
            top: 15%; right: 10%;
            width: 150px;
            animation: catFloat 4s ease-in-out infinite alternate;
        }
        @keyframes catFloat {
            0% { transform: translateY(0px) rotate(-3deg); }
            100% { transform: translateY(-20px) rotate(3deg); }
        }

        /* 4. Mèo lấp ló từ góc dưới bên phải */
        .cat-peeking {
            bottom: -50px; right: 5%;
            width: 160px;
            transform-origin: bottom center;
            animation: catPeek 7s ease-in-out infinite;
        }
        @keyframes catPeek {
            0%, 100% { transform: translateY(100%); } /* Nấp đi */
            15%, 85% { transform: translateY(-40px) rotate(-10deg); } /* Ló đầu ra */
        }
        
        /* === STICKER GIF MÈO Ở GÓC BỨC THƯ === */
        .letter-sticker {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 75px;
            height: auto;
            animation: stickerBounce 2s ease-in-out infinite alternate;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));
        }
        @keyframes stickerBounce {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(5deg); }
        }

        /* === STICKER GIF MÈO Ở GÓC BỨC THƯ 2 === */
        .letter-sticker2 {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 75px;
            height: auto;
            animation: stickerBounce 2s ease-in-out infinite alternate;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));
        }
        @keyframes stickerBounce {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(5deg); }
        }
        
        /* === MÀN HÌNH INTRO === */
        #intro-screen { z-index: 10; }
        .btn-open {
            padding: 15px 40px; font-size: 20px; background-color: #ff4081; color: white;
            border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
            animation: pulse 2s infinite; z-index: 20;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* === HIỆU ỨNG MÂY MÙ === */
        .fog-overlay {
            position: fixed; top: 50%; left: 50%; width: 300vw; height: 300vw;
            background: radial-gradient(circle, rgba(255,255,255,1) 10%, rgba(255,255,255,0.8) 40%, transparent 70%);
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none; z-index: 9999;
            transition: transform 1.5s ease-in, opacity 1s ease-out;
        }
        .fog-overlay.active { transform: translate(-50%, -50%) scale(1); }
        .fog-overlay.fade-out { opacity: 0; }

        /* === MÀN HÌNH VIDEO CẬP NHẬT FULL MÀN HÌNH === */
        #video-screen { background-color: black; padding: 0; }
        video {
            width: 100vw !important; height: 100vh !important;
            object-fit: cover !important; border-radius: 0 !important; max-width: none !important;
        }

        /* === HIỆU ỨNG MỞ PHONG THƯ === */
        #envelope-transition-screen { background-color: #fdf6f0; z-index: 20; }
        .envelope {
            width: 300px; height: 200px; background-color: #e8d5b5; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .flap {
            position: absolute; top: 0; left: 0;
            border-left: 150px solid transparent; border-right: 150px solid transparent;
            border-top: 120px solid #d4b88c;
            transform-origin: top; transition: transform 1.5s ease-in-out; z-index: 3;
        }
        .envelope-body {
            position: absolute; bottom: 0; left: 0;
            border-left: 150px solid #e0c9a6; border-right: 150px solid #e0c9a6; border-bottom: 120px solid #c8b08f; z-index: 2;
        }
        .paper-inside {
            position: absolute; bottom: 10px; left: 10px; right: 10px; height: 180px; background-color: #fff;
            z-index: 1; transition: transform 1.5s ease-in-out;
        }
        .envelope.open .flap { transform: rotateX(180deg); }
        .envelope.open .paper-inside { transform: translateY(-100px); }

        /* === MÀN HÌNH LÁ THƯ CHÍNH === */
        #letter-screen {
            z-index: 30;
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            background-color: #fdf5e6;
        }
        /* === KHUNG THƯ & THANH CUỘN TÙY CHỈNH === */
    .letter-content {
        width: 85%; max-width: 500px; max-height: 80vh; padding: 30px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        font-size: 18px; line-height: 1.8; border-radius: 15px; text-align: justify;
        z-index: 20; position: relative;
        display: flex; flex-direction: column;
    }
    
    /* Vùng chứa văn bản có thanh cuộn */
    .text-scroll-container {
        overflow-y: auto;
        max-height: 45vh; /* Giới hạn chiều cao phần chữ để khung thư không bị dài quá màn hình điện thoại */
        padding-right: 8px;
        margin-bottom: 10px;
        /* Tạo thanh cuộn mỏng màu hồng dễ thương */
        scrollbar-width: thin;
        scrollbar-color: #ff4081 #fce4ec;
    }
    .text-scroll-container::-webkit-scrollbar {
        width: 6px;
    }
    .text-scroll-container::-webkit-scrollbar-track {
        background: #fce4ec;
        border-radius: 10px;
    }
    .text-scroll-container::-webkit-scrollbar-thumb {
        background-color: #ff4081;
        border-radius: 10px;
    }

    .typing-text { min-height: 100px; color: #444; margin: 0; }
    
    /* Sticker mèo góc thư */
    .letter-sticker {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 75px;
        height: auto;
        animation: stickerBounce 2s ease-in-out infinite alternate;
        filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));
        z-index: 10;
    }
    .letter-sticker2 {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 75px;
        height: auto;
        animation: stickerBounce 2s ease-in-out infinite alternate;
        filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));
        z-index: 10;
    }
        .typing-text { min-height: 150px; color: #444; }
        .typing-cursor::after { content: '|'; color: #d63384; font-weight: bold; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <!-- HIỆU ỨNG MÂY MÙ -->
    <div class="fog-overlay" id="fog"></div>

    <!-- AUDIO NHẠC NỀN -->
    <audio id="bg-music" loop>
        <source src="nhac.mp3" type="audio/mpeg">
    </audio>

   <!-- LỚP CHỨA CÁC BÉ MÈO GIF CỰC ĐẸP -->
    <div id="cat-layer">
        <!-- Mèo đi bộ -->
        <img class="cat-gif cat-walking" src="meo6.gif" alt="Mèo đi bộ">
        
        <!-- Mèo bay lơ lửng -->
        <img class="cat-gif cat-floating" src="meo5.gif" alt="Mèo lơ lửng">
        <img class="cat-gif cat-floating1" src="meo2.gif" alt="Mèo lơ lửng">
        
        <!-- Mèo lấp ló -->
        <img class="cat-gif cat-peeking" src="meo7.gif" alt="Mèo lấp ló">
    </div>

    <!-- MÀN HÌNH 1: INTRO -->
    <div class="screen" id="intro-screen">
        <h1 style="color: #d81b60; margin-bottom: 30px; text-align: center; z-index: 20; position: relative; text-shadow: 2px 2px 5px white;">Có một bức thư dành cho bạn!</h1>
        <button class="btn-open" id="btn-open">Mở Thư Ngay ✨</button>
    </div>

    <!-- MÀN HÌNH 2: VIDEO (FULL MÀN HÌNH) -->
    <div class="screen" id="video-screen">
        <video id="my-video" playsinline>
            <source src="may-bay.mp4" type="video/mp4">
        </video>
    </div>

    <!-- HIỆU ỨNG 3: PHONG THƯ MỞ RA -->
    <div class="screen" id="envelope-transition-screen">
        <div class="envelope" id="envelope">
            <div class="paper-inside"></div>
            <div class="envelope-body"></div>
            <div class="flap"></div>
        </div>
    </div>

    <!-- MÀN HÌNH 4: NỘI DUNG THƯ (CÓ THANH CUỘN) -->
    <div class="screen" id="letter-screen">
        <div class="letter-content">
            <div style="font-size: 40px; text-align: center; margin-bottom: 5px;">💖</div>
            <h2 style="color: #d81b60; text-align: center; margin-bottom: 15px;">Gửi Người Đặc Biệt!</h2>
            
            <!-- THÊM THẺ DIV NÀY ĐỂ TẠO KHUNG CUỘN CHO CHỮ -->
            <div class="text-scroll-container" id="text-scroll">
                <p id="typed-text" class="typing-text typing-cursor"></p>
            </div>
            
            <!-- STICKER MÈO GIF Ở GÓC -->
            <img class="letter-sticker" src="meo1.gif" alt="Sticker Mèo Giao Diện Thư">
            <img class="letter-sticker2" src="meo4.gif" alt="Sticker Mèo Giao Diện Thư">
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CẤU HÌNH BOT TELEGRAM VÀ NỘI DUNG THƯ
        // ==========================================
        const TELEGRAM_BOT_TOKEN = "8696400918:AAG9BCzac5zMevU30EsHTSXgFlvIrn_8gsE"; 
        const TELEGRAM_CHAT_ID = "8805889788";
        const fullMessage = "Cảm ơn bạn đã quét mã QR này! Chúc bạn có một ngày luôn ngập tràn niềm vui, nụ cười và sự may mắn. Hãy luôn mỉm cười. Hãy luôn vui vẻ. Hãy luôn nghĩ tích cực. Hãy luôn chăm sóc bản thân thật tốt. Hãy luôn ra ngoài và khám phá thế giới này. Hãy luôn đứng lên sau mỗi vấp ngã vì cậu rất mạnh mẽ. Hãy luôn tự tin vì là một mảnh ghép không thể thiếu của cuộc sống này. Hãy luôn nhớ có người luôn cần bạn, nhớ tới bạn. Hãy luôn cho phép mình yếu đuối nhưng đừng bao giờ đầu hàng, gục ngã. Hãy luôn yêu bản thân mình nhé. Hãy luôn giữ vững năng lượng tích cực nhé! 🌸";
        
        let charIndex = 0;
        const typingSpeed = 45;

        // Lấy các DOM Element
        const btnOpen = document.getElementById('btn-open');
        const fog = document.getElementById('fog');
        
        const introScreen = document.getElementById('intro-screen');
        const videoScreen = document.getElementById('video-screen');
        const envelopeScreen = document.getElementById('envelope-transition-screen');
        const letterScreen = document.getElementById('letter-screen');
        const catLayer = document.getElementById('cat-layer');
        
        const myVideo = document.getElementById('my-video');
        const bgMusic = document.getElementById('bg-music');
        const envelope = document.getElementById('envelope');
        const typedTextElement = document.getElementById("typed-text");

        async function sendNotification() {
            if (!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN.includes("ĐIỀN_")) return;
            const userAgent = navigator.userAgent;
            let deviceType = "Máy tính / Khác";
            if (/iPhone|iPad|iPod/i.test(userAgent)) deviceType = "📱 iPhone / iPad (iOS)";
            else if (/Android/i.test(userAgent)) deviceType = "📱 Thiết bị Android";
            let appName = "Trình duyệt";
            if (/Zalo/i.test(userAgent)) appName = "Zalo";
            else if (/FBAN|FBAV/i.test(userAgent)) appName = "Facebook";
            else if (/Messenger/i.test(userAgent)) appName = "Messenger";

            const timeStr = new Date().toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' });
            const message = `🔔 *CÓ NGUỜI VỪA MỞ THƯ!*\n\n📲 *Thiết bị:* ${deviceType}\n🌐 *Mở bằng:* ${appName}\n⏰ *Thời gian:* ${timeStr}`;
            
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
            }).catch(e => console.error(e));
        }
        window.onload = sendNotification;

        function switchScreen(hideElement, showElement) {
            hideElement.style.opacity = '0'; hideElement.style.pointerEvents = 'none';
            showElement.style.opacity = '1'; showElement.style.pointerEvents = 'auto'; showElement.style.zIndex = '50';
        }

        function typeWriter() {
            if (charIndex < fullMessage.length) {
                typedTextElement.innerHTML += fullMessage.charAt(charIndex);
                charIndex++; setTimeout(typeWriter, typingSpeed);
            } else {
                typedTextElement.classList.remove("typing-cursor");
            }
        }

        btnOpen.addEventListener('click', () => {
            fog.classList.add('active'); 

            setTimeout(() => {
                switchScreen(introScreen, videoScreen);
                catLayer.style.opacity = '0'; // Ẩn mèo khi chiếu video
                
                myVideo.play().catch(e => console.log("Lỗi phát video:", e));
                fog.classList.add('fade-out'); 
            }, 1200);
        });

        myVideo.addEventListener('ended', () => {
            switchScreen(videoScreen, envelopeScreen);
            bgMusic.play().catch(e => console.log("Lỗi phát nhạc:", e));

            setTimeout(() => { envelope.classList.add('open'); }, 800);

            setTimeout(() => {
                switchScreen(envelopeScreen, letterScreen);
                catLayer.style.opacity = '1'; // Mèo xuất hiện lại khi đọc thư
                setTimeout(typeWriter, 500); 
            }, 2800);
        });
    </script>
</body>
</html>
