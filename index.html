<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Bạn Lời Nhắn Đặc Biệt</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; 
            perspective: 1000px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 450px;
            width: 100%;
            position: absolute;
            z-index: 10;
        }

        /* --- NÚT BẤM --- */
        h1 { color: #d63384; margin-bottom: 15px; font-size: 24px; }
        p { color: #444; line-height: 1.7; font-size: 16px; margin-bottom: 20px; }
        .btn-open {
            background: #d63384;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* --- LỚP VIDEO CHUYỂN CẢNH KÍN MÀN HÌNH --- */
        #transition-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; 
            display: none; 
            z-index: 50; 
            background-color: black;
            transition: opacity 1s ease; /* Hiệu ứng mờ dần khi tắt video */
        }

        /* --- BỨC THƯ CUỐI CÙNG --- */
        #message-content {
            display: none;
            opacity: 0;
            z-index: 5;
            transform: scale(0.8);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .show-letter {
            opacity: 1 !important;
            transform: scale(1) !important;
        }
        .typing-text {
            text-align: left;
            min-height: 100px;
        }
        .typing-cursor::after {
            content: '|';
            color: #d63384;
            font-weight: bold;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .heart { font-size: 50px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- Màn hình chào ban đầu -->
    <div class="card" id="welcome-card">
        <div class="heart">💌</div>
        <h1>Có một bức thư dành cho bạn</h1>
        <p>Bấm vào nút bên dưới để nhận thư nhé!</p>
        <button class="btn-open" onclick="startSequence()">Mở Thư Ngay ✨</button>
    </div>

    <!-- Video chuyển cảnh 17 giây -->
    <!-- Đảm bảo tên file video bạn tải lên GitHub đúng là may-bay.mp4 -->
    <video id="transition-video" playsinline>
        <source src="may-bay.mp4" type="video/mp4">
    </video>

    <!-- Bức thư hiện ra sau khi video kết thúc -->
    <div class="card" id="message-content">
        <div class="heart">💖</div>
        <h1 style="text-align: center;">Gửi Người Đặc Biệt!</h1>
        <p id="typed-text" class="typing-text typing-cursor"></p>
    </div>

    <!-- Tệp nhạc nền -->
    <!-- Đảm bảo tên file nhạc bạn tải lên GitHub đúng là nhac.mp3 -->
    <audio id="bg-music" loop preload="auto">
        <source src="nhac.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. ĐIỀN THÔNG TIN TELEGRAM BOT CỦA BẠN 
        const TELEGRAM_BOT_TOKEN = "8696400918:AAG9BCzac5zMevU30EsHTSXgFlvIrn_8gsE"; 
        const TELEGRAM_CHAT_ID = "8805889788";
        
        // 2. LỜI NHẮN SẼ GÕ RA
        const fullMessage = "Cảm ơn bạn đã quét mã QR này! Chúc bạn có một ngày luôn ngập tràn niềm vui, nụ cười và sự may mắn. Hãy luôn giữ vững năng lượng tích cực nhé! 🌸";
        
        let charIndex = 0;
        const typingSpeed = 45; 

        function startSequence() {
            // Ẩn thẻ chào
            document.getElementById('welcome-card').style.display = 'none';

            // PHÁT NHẠC NGAY LẬP TỨC ĐỂ XEM VIDEO 17 GIÂY CÓ NHẠC NỀN
            const music = document.getElementById('bg-music');
            music.play().catch(e => console.log("Lỗi phát nhạc:", e));

            // Bật video lên full màn hình và phát
            const video = document.getElementById('transition-video');
            video.style.display = 'block';
            
            video.play().catch(error => {
                console.log("Lỗi không phát được video:", error);
                video.style.display = 'none';
                showLetter(); 
            });

            // Lệnh video.onended sẽ tự động canh đúng lúc video 17s kết thúc
            video.onended = function() {
                video.style.opacity = '0'; // Hiệu ứng mờ dần video
                setTimeout(() => { 
                    video.style.display = 'none'; 
                    showLetter(); 
                }, 1000); // Chờ 1 giây cho video mờ hẳn rồi mới mở thư
            };
        }

        function showLetter() {
            const msgCard = document.getElementById('message-content');
            msgCard.style.display = 'block';
            
            setTimeout(() => {
                msgCard.classList.add('show-letter');
                typeWriter(); 
            }, 100);
        }

        function typeWriter() {
            const typedTextElement = document.getElementById("typed-text");
            if (charIndex < fullMessage.length) {
                typedTextElement.innerHTML += fullMessage.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, typingSpeed);
            } else {
                typedTextElement.classList.remove("typing-cursor");
            }
        }

        // Tự động báo Telegram 
        async function sendNotification() {
            if (!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN.includes("ĐIỀN_")) return;
            const userAgent = navigator.userAgent;
            let deviceType = "Máy tính / Khác";
            if (/iPhone|iPad|iPod/i.test(userAgent)) deviceType = "📱 iPhone / iPad (iOS)";
            else if (/Android/i.test(userAgent)) {
                const match = userAgent.match(/Android\s+([0-9\.]+);?\s*([^;\)]*)/i);
                deviceType = match && match[2] ? `📱 Android (${match[2]})` : "📱 Thiết bị Android";
            }
            let appName = "Trình duyệt";
            if (/Zalo/i.test(userAgent)) appName = "Zalo";
            else if (/FBAN|FBAV/i.test(userAgent)) appName = "Facebook";
            else if (/Messenger/i.test(userAgent)) appName = "Messenger";

            const timeStr = new Date().toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' });
            const message = `🔔 *CÓ NGUỜI VỪA QUÉT MÃ QR!*\n\n📲 *Thiết bị:* ${deviceType}\n🌐 *Mở bằng:* ${appName}\n⏰ *Thời gian:* ${timeStr}`;
            
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
            }).catch(e => console.error(e));
        }
        window.onload = sendNotification;
    </script>
</body>
</html>
