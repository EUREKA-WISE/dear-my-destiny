<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Bạn Lời Nhắn Đặc Biệt</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; /* Tránh hiện thanh cuộn khi máy bay bay */
            perspective: 1000px; /* Tạo hiệu ứng không gian 3D */
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 450px;
            width: 100%;
            position: absolute;
            backface-visibility: hidden;
        }

        /* --- MÀN HÌNH CHÀO BAN ĐẦU --- */
        #welcome-card {
            z-index: 10;
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        h1 {
            color: #d63384;
            margin-bottom: 15px;
            font-size: 24px;
        }
        p {
            color: #444;
            line-height: 1.7;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .btn-open {
            background: #d63384;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* --- MÁY BAY GIẤY VÀ HIỆU ỨNG BAY --- */
        #plane-container {
            position: absolute;
            display: none;
            z-index: 20;
            pointer-events: none;
        }
        .plane-svg {
            width: 100px;
            height: 100px;
            fill: #d63384;
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.2));
        }

        /* Animation gấp thiệp & máy bay bay */
        .fold-card {
            animation: foldAndShrink 0.8s forwards ease-in-out;
        }
        .fly-plane {
            animation: flyAcrossScreen 2s forwards ease-in-out;
        }
        .unfold-letter {
            animation: unfoldCard 1s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes foldAndShrink {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(0.5) rotateX(60deg); opacity: 0.8; }
            100% { transform: scale(0) rotateX(90deg); opacity: 0; }
        }

        @keyframes flyAcrossScreen {
            0% {
                transform: translate(-250px, 200px) scale(0.4) rotate(-30deg);
                opacity: 0;
            }
            30% {
                transform: translate(-50px, -100px) scale(1.2) rotate(15deg);
                opacity: 1;
            }
            60% {
                transform: translate(150px, -50px) scale(0.9) rotate(-10deg);
                opacity: 1;
            }
            100% {
                transform: translate(0px, 0px) scale(2.2) rotate(0deg);
                opacity: 0;
            }
        }

        @keyframes unfoldCard {
            0% {
                transform: scale(0) rotateY(-90deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotateY(0deg);
                opacity: 1;
            }
        }

        /* --- BỨC THƯ CUỐI CÙNG --- */
        #message-content {
            display: none;
            opacity: 0;
            z-index: 5;
        }
        .typing-text {
            text-align: left;
            min-height: 100px;
        }
        .typing-cursor::after {
            content: '|';
            color: #d63384;
            font-weight: bold;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .heart {
            font-size: 50px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card" id="welcome-card">
        <div class="heart">💌</div>
        <h1>Có một bức thư dành cho bạn</h1>
        <p>Bấm vào nút bên dưới để nhận thư nhé!</p>
        <button class="btn-open" onclick="startSequence()">Mở Thư Ngay ✨</button>
    </div>

    <div id="plane-container">
        <svg class="plane-svg" viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
    </div>

    <div class="card" id="message-content">
        <div class="heart">💖</div>
        <h1>Gửi Người Đặc Biệt!</h1>
        <p id="typed-text" class="typing-text typing-cursor"></p>
    </div>

    <audio id="bg-music" loop preload="auto">
        <source src="nhac.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- 1. ĐIỀN THÔNG TIN TELEGRAM BOT CỦA BẠN ---
        const TELEGRAM_BOT_TOKEN = "8696400918:AAG9BCzac5zMevU30EsHTSXgFlvIrn_8gsE"; 
        const TELEGRAM_CHAT_ID = "8805889788";

        // --- 2. NỘI DUNG LỜI NHẮN ---
        const fullMessage = "Cảm ơn bạn đã quét mã QR này! Chúc bạn có một ngày luôn ngập tràn niềm vui, nụ cười và sự may mắn. Hãy luôn giữ vững năng lượng tích cực nhé! 🌸";

        let charIndex = 0;
        const typingSpeed = 45; // Tốc độ gõ chữ (ms)

        // Hàm chạy hiệu ứng chuỗi hành động (Sequence)
        function startSequence() {
            // A. Phát nhạc ngay lập tức khi bấm nút (Tránh bị chặn phát tự động)
            const music = document.getElementById('bg-music');
            music.play().catch(e => console.log("Lỗi phát nhạc:", e));

            // B. Gấp màn hình chào
            const welcomeCard = document.getElementById('welcome-card');
            welcomeCard.classList.add('fold-card');

            // C. Sau 0.7s: Hiện máy bay giấy bay lượn
            setTimeout(() => {
                welcomeCard.style.display = 'none';
                const planeContainer = document.getElementById('plane-container');
                planeContainer.style.display = 'block';
                planeContainer.classList.add('fly-plane');
            }, 700);

            // D. Sau 2.5s (Máy bay bay xong): Mở bức thư & gõ chữ
            setTimeout(() => {
                document.getElementById('plane-container').style.display = 'none';
                const msgCard = document.getElementById('message-content');
                msgCard.style.display = 'block';
                msgCard.classList.add('unfold-letter');
                
                // Bắt đầu gõ chữ
                typeWriter();
            }, 2500);
        }

        // Hàm gõ chữ tự động
        function typeWriter() {
            const typedTextElement = document.getElementById("typed-text");
            if (charIndex < fullMessage.length) {
                typedTextElement.innerHTML += fullMessage.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, typingSpeed);
            } else {
                typedTextElement.classList.remove("typing-cursor");
            }
        }

        // Tự động gửi thông báo báo về Telegram khi có người quét mã
        async function sendNotification() {
            if (!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN.includes("ĐIỀN_")) return;

            const userAgent = navigator.userAgent;
            let deviceType = "Máy tính / Khác";
            
            if (/iPhone|iPad|iPod/i.test(userAgent)) {
                deviceType = "📱 iPhone / iPad (iOS)";
            } else if (/Android/i.test(userAgent)) {
                const match = userAgent.match(/Android\s+([0-9\.]+);?\s*([^;\)]*)/i);
                deviceType = match && match[2] ? `📱 Android (${match[2]})` : "📱 Thiết bị Android";
            }

            let appName = "Trình duyệt (Safari/Chrome)";
            if (/Zalo/i.test(userAgent)) appName = "Ứng dụng Zalo";
            else if (/FBAN|FBAV/i.test(userAgent)) appName = "Ứng dụng Facebook";
            else if (/Messenger/i.test(userAgent)) appName = "Ứng dụng Messenger";

            let locationStr = "Không rõ";
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if (data.city && data.country_name) {
                    locationStr = `${data.city}, ${data.country_name}`;
                }
            } catch (e) {}

            const timeStr = new Date().toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' });
            
            const message = `🔔 *CÓ NGUỜI VỪA QUÉT MÃ QR!*\n\n` +
                            `📲 *Thiết bị:* ${deviceType}\n` +
                            `🌐 *Mở bằng:* ${appName}\n` +
                            `📍 *Vị trí:* ${locationStr}\n` +
                            `⏰ *Thời gian:* ${timeStr}`;

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            }).catch(err => console.error("Lỗi gửi Telegram:", err));
        }

        window.onload = sendNotification;
    </script>
</body>
</html>
