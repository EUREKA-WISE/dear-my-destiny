<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Bạn Lời Nhắn Đặc Biệt</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
            transition: all 0.5s ease;
        }
        h1 {
            color: #d63384;
            margin-bottom: 15px;
            font-size: 24px;
        }
        p {
            color: #444;
            line-height: 1.7;
            font-size: 16px;
            margin-bottom: 20px;
            text-align: left; /* Căn trái cho lời nhắn giống bức thư */
            min-height: 100px; /* Giữ khung không bị co giãn khi đang gõ */
        }
        /* Hiệu ứng con trỏ nhấp nháy khi gõ chữ */
        .typing-cursor::after {
            content: '|';
            color: #d63384;
            font-weight: bold;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .btn-open {
            background: #d63384;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        #message-content {
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .heart {
            font-size: 50px;
            color: #e63946;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card" id="welcome-card">
        <div class="heart">💌</div>
        <h1>Có một bức thư dành cho bạn</h1>
        <p style="text-align: center;">Bấm vào nút bên dưới để mở thư và thưởng thức giai điệu nhé!</p>
        <button class="btn-open" onclick="openLetter()">Mở Thư Ngay ✨</button>
    </div>

    <div class="card" id="message-content">
        <div class="heart">💖</div>
        <h1 style="text-align: center;">Gửi Người Đặc Biệt!</h1>
        
        <p id="typed-text" class="typing-cursor"></p>
    </div>

    <audio id="bg-music" loop>
        <source src="nhac.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. ĐIỀN LẠI TELEGRAM BOT TOKEN VÀ CHAT ID CỦA BẠN VÀO ĐÂY
        const TELEGRAM_BOT_TOKEN = "8696400918:AAG9BCzac5zMevU30EsHTSXgFlvIrn_8gsE"; 
        const TELEGRAM_CHAT_ID = "8805889788";

        // 2. NỘI DUNG LỜI NHẮN BẠN MUỐN GÕ (Thay đổi tùy ý)
        const fullMessage = "Cảm ơn bạn đã quét mã QR này! Chúc bạn có một ngày luôn ngập tràn niềm vui, nụ cười và sự may mắn. Hãy luôn giữ vững năng lượng tích cực nhé! 🌸";

        let charIndex = 0;
        const typingSpeed = 50; // Tốc độ gõ: 50ms cho mỗi ký tự (càng nhỏ gõ càng nhanh)

        // Hàm tạo hiệu ứng gõ chữ
        function typeWriter() {
            const typedTextElement = document.getElementById("typed-text");
            if (charIndex < fullMessage.length) {
                typedTextElement.innerHTML += fullMessage.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, typingSpeed);
            } else {
                // Khi gõ xong thì ẩn con trỏ nhấp nháy đi
                typedTextElement.classList.remove("typing-cursor");
            }
        }

        // Hàm mở thư, phát nhạc và bắt đầu gõ chữ
        function openLetter() {
            document.getElementById('welcome-card').style.display = 'none';
            const msgCard = document.getElementById('message-content');
            msgCard.style.display = 'block';
            
            setTimeout(() => { 
                msgCard.style.opacity = '1';
                // Bắt đầu chạy hiệu ứng gõ chữ
                typeWriter();
            }, 100);

            // Phát nhạc nền
            const music = document.getElementById('bg-music');
            music.play().catch(e => console.log("Lỗi phát nhạc:", e));
        }

        // Tự động gửi thông báo báo về Telegram khi có người mở web
        async function sendNotification() {
            if (TELEGRAM_BOT_TOKEN.includes("ĐIỀN_")) return; // Bỏ qua nếu chưa điền token

            const userAgent = navigator.userAgent;
            let deviceType = "Máy tính / Khác";
            
            if (/iPhone|iPad|iPod/i.test(userAgent)) {
                deviceType = "📱 iPhone / iPad (iOS)";
            } else if (/Android/i.test(userAgent)) {
                const match = userAgent.match(/Android\s+([0-9\.]+);?\s*([^;\)]*)/i);
                deviceType = match && match[2] ? `📱 Android (${match[2]})` : "📱 Thiết bị Android";
            }

            let appName = "Trình duyệt (Safari/Chrome)";
            if (/Zalo/i.test(userAgent)) appName = "Ứng dụng Zalo";
            else if (/FBAN|FBAV/i.test(userAgent)) appName = "Ứng dụng Facebook";
            else if (/Messenger/i.test(userAgent)) appName = "Ứng dụng Messenger";

            let locationStr = "Không rõ";
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if (data.city && data.country_name) {
                    locationStr = `${data.city}, ${data.country_name}`;
                }
            } catch (e) {}

            const timeStr = new Date().toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' });
            
            const message = `🔔 *CÓ NGUỜI VỪA QUÉT MÃ QR!*\n\n` +
                            `📲 *Thiết bị:* ${deviceType}\n` +
                            `🌐 *Mở bằng:* ${appName}\n` +
                            `📍 *Vị trí:* ${locationStr}\n` +
                            `⏰ *Thời gian:* ${timeStr}`;

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            }).catch(err => console.error("Lỗi gửi Telegram:", err));
        }

        window.onload = sendNotification;
    </script>
</body>
</html>
